<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Details</title>
  <link rel="stylesheet" href="chekout.css">
</head>

<body>

<div class="container">

  <h2>Shipping Details</h2>

  <div class="summary-box">
    <h3>Order Summary</h3>
    <p>Book: <strong>Teen To Millionaire</strong></p>
    <p>Quantity: <strong id="qty">1</strong></p>
    <p>Total Amount: <strong>₹<span id="total">899</span></strong></p>
  </div>

  <div class="form">

    <label>Name</label>
    <input id="name" type="text" placeholder="Full name">

    <label>Phone</label>
    <input id="phone" type="tel" placeholder="9876543210">

    <label>Address</label>
    <textarea id="address" rows="3" placeholder="House No, Street, Area, Landmark"></textarea>

    <div class="row">
      <input id="city" type="text" placeholder="City">
      <input id="state" type="text" placeholder="State">
      <input id="pincode" type="text" placeholder="Pincode">
    </div>

    <button class="btn-primary" onclick="startPayment()">Pay Online</button>

    <button class="btn-cod" onclick="placeCOD()">
      🧾 Cash on Delivery
      <span class="cod-sub">Pay when product arrives</span>
    </button>

  </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>

/* LOAD DATA */
document.getElementById("qty").innerText = localStorage.getItem("order_qty") || 1;
document.getElementById("total").innerText = localStorage.getItem("order_total") || 899;

/* FORM DATA */
function getFormData() {
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const address = document.getElementById("address").value;
  const city = document.getElementById("city").value;
  const state = document.getElementById("state").value;
  const pincode = document.getElementById("pincode").value;

  if (!name || !phone || !address || !pincode) {
    alert("Please fill all required fields!");
    return null;
  }

  return { name, phone, address, city, state, pincode };
}

/* 💳 RAZORPAY */
function startPayment() {
  const user = getFormData();
  if (!user) return;

  let amount = Number(localStorage.getItem("order_total") || 899) * 100;

  var options = {
    key: "rzp_live_RQued3FP5TVGu5",
    amount: amount,
    currency: "INR",
    name: "Teen To Millionaire",
    description: "Book Purchase",
    handler: function () {
      alert("Payment Successful!");
      window.location.href = "success.html";
    },
    prefill: {
      name: user.name,
      contact: user.phone
    }
  };

  var pay = new Razorpay(options);
  pay.open();
}

/* 🚚 COD → EMAIL (NO KEY) */
function placeCOD() {

  const user = getFormData();
  if (!user) return;

  const btn = document.querySelector(".btn-cod");
  btn.classList.add("loading");
  btn.innerHTML = "⏳ Placing Order...";

  const orderId = "ORD" + Date.now();
  const amount = localStorage.getItem("order_total") || 899;
  const qty = localStorage.getItem("order_qty") || 1;

  const subject = `New COD Order - ${orderId}`;

  const body = `
New COD Order

Product: Teen To Millionaire
Quantity: ${qty}
Amount: ₹${amount}

Name: ${user.name}
Phone: ${user.phone}
Address: ${user.address}, ${user.city}, ${user.state} - ${user.pincode}

Order ID: ${orderId}
`;


  const email = "aditya@devamedianetwork.org";

  // Open email app
  window.location.href = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

  setTimeout(() => {
    alert("📩 Please send the email to confirm your order");
    window.location.href = "success.html";
  }, 1000);
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Deva Media</title>
  <link rel="stylesheet" href="chekout.css">
</head>

<body>
  <div class="container">

    <!-- LEFT -->
    <div class="card">
      <div class="product">
        <img class="cover" src="book.jpg" alt="Book cover">

        <div style="flex:1;">
          <h1>Teen To Millionaire</h1>
          <div class="muted">Powered By Devamedianetwork</div>
          <div class="price">₹499</div>
          <div class="muted">Inclusive of all taxes</div>

          <div class="qty">
            <label>Quantity</label>
            <input id="qty" type="number" min="1" value="1">
            <div class="small" style="margin-left:auto;">Shipping across India</div>
          </div>

          <div style="margin-top:14px;">
            <div class="section-title">Order Summary</div>
            <div class="small">
              Price × Quantity = <strong id="summary-price">₹499</strong>
            </div>
          </div>

          <div style="margin-top:16px;">
            <div class="section-title">Shipping Address</div>

            <label>Name</label>
            <input id="name" type="text" placeholder="Full name">

            <label>Phone</label>
            <input id="phone" type="tel" placeholder="+91-9876543210">

            <label>Address</label>
            <textarea id="address" rows="3" placeholder="House, Street, Landmark"></textarea>

            <div style="display:flex; gap:8px;">
              <input id="city" type="text" placeholder="City">
              <input id="state" type="text" placeholder="State">
              <input id="pincode" type="text" placeholder="Pincode">
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="card checkout-side">
      <div>
        <div class="section-title">Payment Method</div>

        <label class="pm-btn">
          <input type="radio" name="pm" value="razorpay" checked>
          Pay with Razorpay (UPI / Card / Wallet)
        </label>
      </div>

      <div>
        <button id="place-order" class="btn-primary">Pay Now</button>
      </div>

      <div>
        <div class="section-title">Support</div>
        <div class="small">Questions? contact business@devamedianetwork.com</div>
      </div>
    </div>

  </div>

  <!-- Razorpay -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script>
    const qtyEl = document.getElementById("qty");

    function getOrder() {
      const qty = Math.max(1, parseInt(qtyEl.value));
      const price = 499;
      return {
        qty,
        total: qty * price,
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        address: document.getElementById("address").value,
        city: document.getElementById("city").value,
        state: document.getElementById("state").value,
        pincode: document.getElementById("pincode").value
      };
    }

    qtyEl.addEventListener("input", () => {
      const o = getOrder();
      document.getElementById("summary-price").innerText = "₹" + o.total;
    });

    // PAYMENT BUTTON — LIVE MODE
    document.getElementById("place-order").addEventListener("click", () => {

      const o = getOrder();

      if (!o.name || !o.phone || !o.address || !o.pincode) {
        alert("Please fill shipping details.");
        return;
      }

      var options = {
        "key": "rzp_live_RQued3FP5TVGu5",  // 👉 Your LIVE key (already added)
        "amount": o.total * 100,
        "currency": "INR",
        "name": "Deva Media",
        "description": "Book Purchase",

        "handler": function (response) {
          alert("Payment Successful!\nPayment ID: " + response.razorpay_payment_id);
          window.location = "/thankyou.html";
        },

        "prefill": {
          "name": o.name,
          "contact": o.phone
        },

        "theme": { "color": "#ff6a00" },
        "method": { "upi": true }
      };

      var pay = new Razorpay(options);
      pay.open();
    });
  </script>

</body>
</html>
